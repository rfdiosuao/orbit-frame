<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生图服务 · 轨映</title><link rel="stylesheet" href="/heang/tokens.css"><link rel="stylesheet" href="/style.css"><style>main{max-width:700px;margin:40px auto;padding:28px}form{display:grid;gap:16px}label{display:grid;gap:8px}input,button{padding:12px;font:inherit}button{cursor:pointer}#status{white-space:pre-wrap}nav{display:flex;gap:20px}</style></head>
<body><main><nav><a href="/">轨映首页</a><a href="/canvas.html">返回画布</a></nav><h1>生图服务</h1><p>豆包客户端可直接使用。配置外部兼容服务后，画布、CLI 和 MCP 会共用这项配置。</p>
<form id="providerForm"><label>API 地址<input id="providerUrl" type="url" placeholder="http://127.0.0.1:63451/v1" required></label><label>服务密钥<input id="providerKey" type="password" autocomplete="off" placeholder="首次填写；留空保留已保存密钥"></label><label>模型名称<input id="providerModel" value="gpt-image-2.5" required></label><label><span><input id="providerEdit" type="checkbox" checked> 服务支持参考图编辑（images/edits）</span></label><button type="submit">保存到本机并检查连接</button></form><p id="status" role="status">正在读取配置…</p><p>密钥仅保存在本机，不会返回到页面、MCP 或任务结果。外部同步服务的超时保留为结果未知；取消和任务查询取决于服务实际能力。</p></main><script type="module" src="/image-provider-ui.js"></script></body></html>
